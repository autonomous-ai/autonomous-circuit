<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512">
  <rect width="24" height="24" rx="5.4" fill="#d2643a"/>
  <!-- An IC seen from above: body, six legs, and the pin-1 dot every real
       package carries. A chip is the one electronics mark everybody already
       reads, and it says silicon as well as circuit.

       Drawn for 16px, which is where it actually lives in the menu bar. Two
       legs a side read as a battery; four sides of legs went to mush; three a
       side is the most chip it can be and still hold its silhouette when each
       leg is barely more than a pixel. -->
  <g stroke="#fff" stroke-width="2.1" stroke-linecap="round">
    <path d="M3.0 8.2h3.4M3.0 12h3.4M3.0 15.8h3.4M17.6 8.2h3.4M17.6 12h3.4M17.6 15.8h3.4"/>
  </g>
  <rect x="6.1" y="5.5" width="11.8" height="13" rx="2.1" fill="#fff"/>
  <circle cx="9.3" cy="8.7" r="1.5" fill="#d2643a"/>
</svg>
