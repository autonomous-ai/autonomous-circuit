<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 1756" width="1740" height="1756" font-family="Poppins, Avenir Next, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 10 6 L 1.5 10.5" fill="none" stroke="#6f6f6f"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1740" height="1756" fill="#ffffff"/>
  <text x="870" y="66" font-size="44" fill="#1a1a1a" text-anchor="middle" font-weight="700">One run, from a sentence to a fab packet</text>
  <line x1="130" y1="210" x2="130" y2="1656" stroke="#dadada" stroke-width="2"/>
  <line x1="350" y1="210" x2="350" y2="1656" stroke="#dadada" stroke-width="2"/>
  <line x1="610" y1="210" x2="610" y2="1656" stroke="#dadada" stroke-width="2"/>
  <line x1="920" y1="210" x2="920" y2="1656" stroke="#dadada" stroke-width="2"/>
  <line x1="1240" y1="210" x2="1240" y2="1656" stroke="#dadada" stroke-width="2"/>
  <line x1="1560" y1="210" x2="1560" y2="1656" stroke="#dadada" stroke-width="2"/>
  <rect x="80.74875" y="150" width="98.5025" height="60" rx="12" fill="#e6f4ec"/>
  <text x="130" y="188" font-size="25" fill="#265f45" text-anchor="middle" font-weight="700">You</text>
  <rect x="274.885" y="150" width="150.23" height="60" rx="12" fill="#cfe9dc"/>
  <text x="350" y="188" font-size="25" fill="#265f45" text-anchor="middle" font-weight="700">The app</text>
  <rect x="513.72375" y="150" width="192.55249999999998" height="60" rx="12" fill="#8ed2b3"/>
  <text x="610" y="188" font-size="25" fill="#123d2a" text-anchor="middle" font-weight="700">circuitcode</text>
  <rect x="822.94" y="150" width="194.12" height="60" rx="12" fill="#f0c8b4"/>
  <text x="920" y="188" font-size="25" fill="#7a3418" text-anchor="middle" font-weight="700">The checks</text>
  <rect x="1120.995" y="150" width="238.01000000000002" height="60" rx="12" fill="#35a97c"/>
  <text x="1240" y="188" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="700">design-review</text>
  <rect x="1447.7875" y="150" width="224.42499999999998" height="60" rx="12" fill="#17875e"/>
  <text x="1560" y="188" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="700">Golden blocks</text>
  <rect x="80.74875" y="1656" width="98.5025" height="60" rx="12" fill="#e6f4ec"/>
  <text x="130" y="1694" font-size="25" fill="#265f45" text-anchor="middle" font-weight="700">You</text>
  <rect x="274.885" y="1656" width="150.23" height="60" rx="12" fill="#cfe9dc"/>
  <text x="350" y="1694" font-size="25" fill="#265f45" text-anchor="middle" font-weight="700">The app</text>
  <rect x="513.72375" y="1656" width="192.55249999999998" height="60" rx="12" fill="#8ed2b3"/>
  <text x="610" y="1694" font-size="25" fill="#123d2a" text-anchor="middle" font-weight="700">circuitcode</text>
  <rect x="822.94" y="1656" width="194.12" height="60" rx="12" fill="#f0c8b4"/>
  <text x="920" y="1694" font-size="25" fill="#7a3418" text-anchor="middle" font-weight="700">The checks</text>
  <rect x="1120.995" y="1656" width="238.01000000000002" height="60" rx="12" fill="#35a97c"/>
  <text x="1240" y="1694" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="700">design-review</text>
  <rect x="1447.7875" y="1656" width="224.42499999999998" height="60" rx="12" fill="#17875e"/>
  <text x="1560" y="1694" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="700">Golden blocks</text>
  <rect x="548" y="686" width="1132" height="590" rx="18" fill="#eaf7f0" stroke="#4cb389" stroke-width="2.5"/>
  <rect x="949.6275" y="660" width="328.745" height="52" rx="12" fill="#cfe9dc" stroke="#a7d9c0" stroke-width="2"/>
  <text x="1114" y="694" font-size="25" fill="#265f45" text-anchor="middle" font-weight="700">Until nothing is wrong</text>
  <text x="1114" y="1230" font-size="24" fill="#2f7a58" text-anchor="middle" font-weight="700">at most 2 tries, then 3, then 2</text>
  <line x1="136" y1="256" x2="342" y2="256" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="148" y="240" font-size="24" fill="#3f3f3f" text-anchor="start">describe the gadget</text>
  <line x1="356" y1="322" x2="602" y2="322" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="368" y="306" font-size="24" fill="#3f3f3f" text-anchor="start">start a session</text>
  <line x1="616" y1="388" x2="1552" y2="388" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="628" y="372" font-size="24" fill="#3f3f3f" text-anchor="start">what could build this?</text>
  <line x1="1554" y1="454" x2="618" y2="454" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="628" y="438" font-size="24" fill="#3f3f3f" text-anchor="start">these blocks — or: nothing in the catalog fits</text>
  <line x1="604" y1="520" x2="138" y2="520" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="148" y="504" font-size="24" fill="#3f3f3f" text-anchor="start">the plan: parts, pins, rough cost</text>
  <line x1="136" y1="586" x2="602" y2="586" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="148" y="570" font-size="24" fill="#3f3f3f" text-anchor="start" font-weight="700">you approve</text>
  <path d="M 610 742 a 38 29 0 1 1 -6 54" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="666" y="776" font-size="24" fill="#3f3f3f" text-anchor="start">write the board</text>
  <line x1="616" y1="858" x2="912" y2="858" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="628" y="842" font-size="24" fill="#3f3f3f" text-anchor="start">build it</text>
  <path d="M 920 924 a 38 29 0 1 1 -6 54" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="976" y="958" font-size="24" fill="#3f3f3f" text-anchor="start">compile it, then check it two ways</text>
  <line x1="914" y1="1040" x2="618" y2="1040" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="628" y="1024" font-size="24" fill="#3f3f3f" text-anchor="start">everything wrong with it</text>
  <path d="M 610 1106 a 38 29 0 1 1 -6 54" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="666" y="1140" font-size="24" fill="#3f3f3f" text-anchor="start">fix what blocks it</text>
  <line x1="616" y1="1332" x2="1232" y2="1332" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="628" y="1316" font-size="24" fill="#3f3f3f" text-anchor="start">nothing blocks it — review it</text>
  <path d="M 1240 1398 a 38 29 0 1 1 -6 54" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="1296" y="1432" font-size="24" fill="#3f3f3f" text-anchor="start">seven experts, each scoring alone</text>
  <line x1="1234" y1="1514" x2="618" y2="1514" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="628" y="1498" font-size="24" fill="#3f3f3f" text-anchor="start">what to fix — round again, up to 4 times</text>
  <line x1="604" y1="1580" x2="358" y2="1580" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="368" y="1564" font-size="24" fill="#3f3f3f" text-anchor="start">every score 7 or better</text>
</svg>
