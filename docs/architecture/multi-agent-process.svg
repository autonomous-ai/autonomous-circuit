<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1740" width="1960" height="1740"
     font-family="Poppins, Avenir Next, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#6f6f6f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1960" height="1740" fill="#ffffff"/>
  <text x="980" y="86" text-anchor="middle" font-size="52" font-weight="700" fill="#111111">How a board gets designed</text>

  <!-- lifelines -->
  <g stroke="#d5d5d5" stroke-width="2">
    <line x1="150"  y1="248" x2="150"  y2="1600"/>
    <line x1="400"  y1="248" x2="400"  y2="1600"/>
    <line x1="700"  y1="248" x2="700"  y2="1600"/>
    <line x1="1000" y1="248" x2="1000" y2="1600"/>
    <line x1="1290" y1="248" x2="1290" y2="1600"/>
    <line x1="1580" y1="248" x2="1580" y2="1600"/>
    <line x1="1850" y1="248" x2="1850" y2="1600"/>
  </g>

  <!-- participants, top -->
  <g>
    <rect x="52"   y="184" width="196" height="70" rx="12" fill="#e9f6ef" stroke="#bfe3d1" stroke-width="2"/>
    <text x="150"  y="228" text-anchor="middle" font-size="27" font-weight="700" fill="#2c6b4f">You</text>

    <rect x="288"  y="184" width="224" height="70" rx="12" fill="#cdeadb" stroke="#a5d8bf" stroke-width="2"/>
    <text x="400"  y="228" text-anchor="middle" font-size="27" font-weight="700" fill="#2c6b4f">The app</text>

    <rect x="576"  y="184" width="248" height="70" rx="12" fill="#8fd2b2"/>
    <text x="700"  y="228" text-anchor="middle" font-size="27" font-weight="700" fill="#15452f">circuitcode</text>

    <rect x="866"  y="184" width="268" height="70" rx="12" fill="#6bc79e"/>
    <text x="1000" y="228" text-anchor="middle" font-size="26" font-weight="700" fill="#0f3b26">circuit-analysis</text>

    <rect x="1158" y="184" width="264" height="70" rx="12" fill="#f2c9b6"/>
    <text x="1290" y="228" text-anchor="middle" font-size="27" font-weight="700" fill="#7a3418">The gauntlet</text>

    <rect x="1444" y="184" width="272" height="70" rx="12" fill="#33a97b"/>
    <text x="1580" y="228" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">design-review</text>

    <rect x="1740" y="184" width="200" height="70" rx="12" fill="#1a8f63"/>
    <text x="1840" y="228" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">Golden blocks</text>
  </g>

  <!-- ============ plan phase ============ -->
  <line x1="150" y1="326" x2="392" y2="326" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="164" y="306" font-size="25" fill="#3d3d3d">describe the gadget</text>

  <line x1="400" y1="392" x2="692" y2="392" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="414" y="372" font-size="25" fill="#3d3d3d">spawn circuitcode</text>

  <line x1="700" y1="452" x2="992" y2="452" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="714" y="432" font-size="25" fill="#3d3d3d">what is actually being asked for?</text>

  <line x1="1000" y1="512" x2="708" y2="512" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="714" y="492" font-size="25" fill="#3d3d3d">capabilities · power budget · size class</text>

  <line x1="700" y1="572" x2="1842" y2="572" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="714" y="552" font-size="25" fill="#3d3d3d">which validated blocks cover it?</text>

  <line x1="1850" y1="632" x2="708" y2="632" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="714" y="612" font-size="25" fill="#3d3d3d">the blocks, frozen — or "not in the catalog"</text>

  <line x1="700" y1="694" x2="158" y2="694" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="176" y="674" font-size="25" fill="#3d3d3d">the plan: blocks, pin table, cost band</text>

  <line x1="150" y1="754" x2="692" y2="754" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="176" y="734" font-size="25" font-weight="700" fill="#3d3d3d">you approve</text>

  <!-- ============ build + repair loop ============ -->
  <rect x="612" y="800" width="1130" height="520" rx="18" fill="#eaf7f0" stroke="#4db38a" stroke-width="2.5"/>
  <rect x="1000" y="778" width="380" height="56" rx="12" fill="#cdeadb" stroke="#a5d8bf" stroke-width="2"/>
  <text x="1190" y="815" text-anchor="middle" font-size="27" font-weight="700" fill="#2c6b4f">Build and repair</text>

  <path d="M 700 866 a 44 34 0 1 1 -8 60" fill="none" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="756" y="892" font-size="25" fill="#3d3d3d">write the board source</text>

  <line x1="700" y1="972" x2="1282" y2="972" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="714" y="952" font-size="25" fill="#3d3d3d">build it</text>

  <path d="M 1290 1006 a 46 34 0 1 1 -8 60" fill="none" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="1348" y="1032" font-size="25" fill="#3d3d3d">compile → our checks → KiCad → DFM → gerbers</text>

  <line x1="1290" y1="1116" x2="708" y2="1116" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="714" y="1096" font-size="25" fill="#3d3d3d">findings, each parsed from an artifact</text>

  <path d="M 700 1150 a 44 34 0 1 1 -8 60" fill="none" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="756" y="1176" font-size="25" fill="#3d3d3d">fix the blocking ones, smallest change first</text>

  <rect x="1052" y="1256" width="470" height="48" rx="12" fill="#cdeadb" stroke="#a5d8bf" stroke-width="2"/>
  <text x="1287" y="1288" text-anchor="middle" font-size="24" font-weight="700" fill="#2c6b4f">anything still blocking?  (caps 2 / 3 / 2)</text>

  <!-- ============ review panel ============ -->
  <line x1="700" y1="1386" x2="1572" y2="1386" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="714" y="1366" font-size="25" fill="#3d3d3d">nothing blocks — review it</text>

  <path d="M 1580 1420 a 46 34 0 1 1 -8 60" fill="none" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="1638" y="1446" font-size="24" fill="#3d3d3d">seven lenses, each scoring alone</text>

  <line x1="1580" y1="1524" x2="708" y2="1524" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="714" y="1504" font-size="25" fill="#3d3d3d">must-fix notes — back to the loop, at most 4 rounds</text>

  <!-- ============ out ============ -->
  <line x1="700" y1="1596" x2="408" y2="1596" stroke="#6f6f6f" stroke-width="2" marker-end="url(#s)"/>
  <text x="424" y="1576" font-size="25" fill="#3d3d3d">every lens ≥ 7</text>

  <!-- participants, bottom -->
  <g>
    <rect x="52"   y="1626" width="196" height="70" rx="12" fill="#e9f6ef" stroke="#bfe3d1" stroke-width="2"/>
    <text x="150"  y="1670" text-anchor="middle" font-size="27" font-weight="700" fill="#2c6b4f">You</text>

    <rect x="288"  y="1626" width="224" height="70" rx="12" fill="#cdeadb" stroke="#a5d8bf" stroke-width="2"/>
    <text x="400"  y="1670" text-anchor="middle" font-size="27" font-weight="700" fill="#2c6b4f">The app</text>

    <rect x="576"  y="1626" width="248" height="70" rx="12" fill="#8fd2b2"/>
    <text x="700"  y="1670" text-anchor="middle" font-size="27" font-weight="700" fill="#15452f">circuitcode</text>

    <rect x="866"  y="1626" width="268" height="70" rx="12" fill="#6bc79e"/>
    <text x="1000" y="1670" text-anchor="middle" font-size="26" font-weight="700" fill="#0f3b26">circuit-analysis</text>

    <rect x="1158" y="1626" width="264" height="70" rx="12" fill="#f2c9b6"/>
    <text x="1290" y="1670" text-anchor="middle" font-size="27" font-weight="700" fill="#7a3418">The gauntlet</text>

    <rect x="1444" y="1626" width="272" height="70" rx="12" fill="#33a97b"/>
    <text x="1580" y="1670" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">design-review</text>

    <rect x="1740" y="1626" width="200" height="70" rx="12" fill="#1a8f63"/>
    <text x="1840" y="1670" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">Golden blocks</text>
  </g>

  <text x="1290" y="152" text-anchor="middle" font-size="24" fill="#8c4322">the only box where no model runs ↓</text>
</svg>
