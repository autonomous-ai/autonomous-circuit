<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1125" width="2000" height="1125"
     font-family="Poppins, Avenir Next, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="2000" height="1125" fill="#ffffff"/>

  <text x="1000" y="96" text-anchor="middle" font-size="56" font-weight="700" fill="#111111">High-level architecture of Autonomous Circuit</text>

  <!-- ============ left: the chat ============ -->
  <rect x="30" y="168" width="560" height="900" rx="26" fill="#eae9e1"/>
  <text x="310" y="248" text-anchor="middle" font-size="40" font-weight="700" fill="#6e6e6e">The chat</text>

  <rect x="64" y="330" width="58" height="58" rx="14" fill="#c8623a"/>
  <text x="93" y="368" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">◆</text>
  <text x="146" y="352" font-size="34" font-weight="700" fill="#1f1f1f">What do you</text>
  <text x="146" y="392" font-size="34" font-weight="700" fill="#1f1f1f">want to build?</text>

  <circle cx="93" cy="486" r="26" fill="none" stroke="#8b8b8b" stroke-width="2.5"/>
  <circle cx="93" cy="477" r="9" fill="none" stroke="#8b8b8b" stroke-width="2.5"/>
  <path d="M 78 502 a 15 13 0 0 1 30 0" fill="none" stroke="#8b8b8b" stroke-width="2.5"/>

  <text x="146" y="470" font-size="27" fill="#4a4a4a">a coaster that reminds</text>
  <text x="146" y="506" font-size="27" fill="#4a4a4a">me to drink water. it</text>
  <text x="146" y="542" font-size="27" fill="#4a4a4a">should light up, and</text>
  <text x="146" y="578" font-size="27" fill="#4a4a4a">know when my cup is</text>
  <text x="146" y="614" font-size="27" fill="#4a4a4a">empty. usb-c powered.</text>

  <text x="146" y="700" font-size="27" fill="#8a8a8a">— then you approve a</text>
  <text x="146" y="736" font-size="27" fill="#8a8a8a">plan, and the boards</text>
  <text x="146" y="772" font-size="27" fill="#8a8a8a">arrive from JLCPCB.</text>

  <!-- ============ arrows between panels ============ -->
  <line x1="600" y1="404" x2="676" y2="404" stroke="#6b6b6b" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="638" y="380" text-anchor="middle" font-size="26" font-weight="600" fill="#4a4a4a">Ask</text>

  <line x1="676" y1="836" x2="600" y2="836" stroke="#6b6b6b" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="638" y="812" text-anchor="middle" font-size="26" font-weight="600" fill="#4a4a4a">Fab packet</text>

  <!-- ============ right: the system ============ -->
  <rect x="676" y="168" width="1294" height="900" rx="26" fill="#eae9e1"/>
  <text x="1323" y="248" text-anchor="middle" font-size="40" font-weight="700" fill="#6e6e6e">Multi-agent PCB system</text>

  <!-- orchestrator -->
  <rect x="1046" y="386" width="540" height="228" rx="14" fill="#b6d3ea"/>
  <text x="1316" y="446" text-anchor="middle" font-size="36" font-weight="700" fill="#16324a">circuitcode</text>
  <text x="1316" y="490" text-anchor="middle" font-size="34" font-weight="700" fill="#16324a">(orchestrator)</text>
  <text x="1316" y="542" text-anchor="middle" font-size="25" fill="#1d3d59">Writes the board source. Tools:</text>
  <text x="1316" y="578" text-anchor="middle" font-size="25" fill="#1d3d59">circuitlib · generator · run_subagent</text>

  <!-- golden blocks (right) -->
  <rect x="1700" y="424" width="230" height="152" rx="14" fill="#b6d3ea"/>
  <text x="1815" y="486" text-anchor="middle" font-size="29" font-weight="700" fill="#16324a">Golden</text>
  <text x="1815" y="522" text-anchor="middle" font-size="29" font-weight="700" fill="#16324a">blocks</text>

  <line x1="1586" y1="500" x2="1692" y2="500" stroke="#6b6b6b" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="1639" y="606" text-anchor="middle" font-size="23" fill="#4a4a4a">compose,</text>
  <text x="1639" y="636" text-anchor="middle" font-size="23" fill="#4a4a4a">never edit</text>

  <!-- the gauntlet (left) — deliberately NOT blue: no model runs here -->
  <rect x="712" y="386" width="264" height="228" rx="14" fill="#f2c9b6"/>
  <text x="844" y="452" text-anchor="middle" font-size="30" font-weight="700" fill="#7a3418">The gauntlet</text>
  <text x="844" y="504" text-anchor="middle" font-size="23" fill="#8c4322">compile · checks</text>
  <text x="844" y="536" text-anchor="middle" font-size="23" fill="#8c4322">KiCad · DFM · gerbers</text>
  <text x="844" y="580" text-anchor="middle" font-size="23" font-weight="700" fill="#7a3418">no model runs here</text>

  <line x1="1038" y1="470" x2="984" y2="470" stroke="#6b6b6b" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="984" y1="540" x2="1038" y2="540" stroke="#6b6b6b" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="1011" y="662" text-anchor="middle" font-size="23" fill="#4a4a4a">findings</text>

  <!-- worker agents -->
  <rect x="722" y="812" width="316" height="132" rx="14" fill="#b6d3ea"/>
  <text x="880" y="870" text-anchor="middle" font-size="28" font-weight="700" fill="#16324a">circuit-analysis</text>
  <text x="880" y="906" text-anchor="middle" font-size="23" fill="#1d3d59">ask → brief</text>

  <rect x="1088" y="812" width="316" height="132" rx="14" fill="#b6d3ea"/>
  <text x="1246" y="870" text-anchor="middle" font-size="28" font-weight="700" fill="#16324a">parts-book</text>
  <text x="1246" y="906" text-anchor="middle" font-size="23" fill="#1d3d59">BOM → orderable</text>

  <rect x="1454" y="812" width="316" height="132" rx="14" fill="#b6d3ea"/>
  <text x="1612" y="870" text-anchor="middle" font-size="28" font-weight="700" fill="#16324a">design-review</text>
  <text x="1612" y="906" text-anchor="middle" font-size="23" fill="#1d3d59">seven lenses</text>

  <path d="M 1180 622 L 1010 800" fill="none" stroke="#6b6b6b" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M 1290 622 L 1264 800" fill="none" stroke="#6b6b6b" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M 1440 622 L 1580 800" fill="none" stroke="#6b6b6b" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- design-review fans out to its own lenses -->
  <path d="M 1660 952 a 46 40 0 1 0 -70 6" fill="none" stroke="#6b6b6b" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="1626" y="1042" text-anchor="middle" font-size="23" fill="#4a4a4a">each lens scores alone</text>
</svg>
