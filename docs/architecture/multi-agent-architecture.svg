<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 900" width="1740" height="900" font-family="Poppins, Avenir Next, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 10 6 L 1.5 10.5" fill="none" stroke="#6f6f6f"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1740" height="900" fill="#ffffff"/>
  <text x="870" y="66" font-size="44" fill="#1a1a1a" text-anchor="middle" font-weight="700">How Autonomous Circuit is put together</text>
  <rect x="40" y="110" width="430" height="690" rx="22" fill="#eceae3"/>
  <text x="255" y="172" font-size="30" fill="#6f6f6f" text-anchor="middle" font-weight="700">What you type</text>
  <text x="78" y="250" font-size="26" fill="#2f2f2f" text-anchor="start">a coaster that reminds me</text>
  <text x="78" y="290" font-size="26" fill="#2f2f2f" text-anchor="start">to drink water. it should</text>
  <text x="78" y="330" font-size="26" fill="#2f2f2f" text-anchor="start">light up when my cup is</text>
  <text x="78" y="370" font-size="26" fill="#2f2f2f" text-anchor="start">empty. usb-c powered.</text>
  <text x="78" y="466" font-size="26" fill="#8a8a8a" text-anchor="start">You get a plan back:</text>
  <text x="78" y="504" font-size="26" fill="#8a8a8a" text-anchor="start">the parts, the pins,</text>
  <text x="78" y="542" font-size="26" fill="#8a8a8a" text-anchor="start">what it will cost.</text>
  <text x="78" y="618" font-size="26" fill="#8a8a8a" text-anchor="start">You say yes.</text>
  <text x="78" y="694" font-size="26" fill="#8a8a8a" text-anchor="start">The boards arrive</text>
  <text x="78" y="732" font-size="26" fill="#8a8a8a" text-anchor="start">from JLCPCB about</text>
  <text x="78" y="770" font-size="26" fill="#8a8a8a" text-anchor="start">two weeks later.</text>
  <rect x="560" y="110" width="1140" height="690" rx="22" fill="#eceae3"/>
  <text x="1130" y="172" font-size="30" fill="#6f6f6f" text-anchor="middle" font-weight="700">What happens next</text>
  <line x1="476" y1="300" x2="552" y2="300" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="514" y="276" font-size="24" fill="#3f3f3f" text-anchor="middle">ask</text>
  <line x1="552" y1="700" x2="476" y2="700" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="514" y="676" font-size="24" fill="#3f3f3f" text-anchor="middle">boards</text>
  <rect x="940.0" y="257.0" width="340" height="146" rx="13" fill="#b8d4ea"/>
  <text x="1110" y="287.0" font-size="27" fill="#123146" text-anchor="middle" font-weight="700">circuitcode</text>
  <text x="1110" y="325.0" font-size="23" fill="#123146" text-anchor="middle">writes the board</text>
  <text x="1110" y="363.0" font-size="23" fill="#123146" text-anchor="middle">runs the others</text>
  <rect x="1470.0" y="276.0" width="184" height="108" rx="13" fill="#b8d4ea"/>
  <text x="1562" y="306.0" font-size="27" fill="#123146" text-anchor="middle" font-weight="700">Golden</text>
  <text x="1562" y="344.0" font-size="27" fill="#123146" text-anchor="middle" font-weight="700">blocks</text>
  <line x1="1300" y1="330" x2="1466" y2="330" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="1383" y="306" font-size="23" fill="#3f3f3f" text-anchor="middle">parts it may use</text>
  <rect x="592.0" y="282.0" width="240" height="108" rx="13" fill="#f0c8b4"/>
  <text x="712" y="312.0" font-size="27" fill="#7a3418" text-anchor="middle" font-weight="700">The checks</text>
  <text x="712" y="350.0" font-size="23" fill="#7a3418" text-anchor="middle">no AI here</text>
  <line x1="958" y1="300" x2="832" y2="300" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="895" y="276" font-size="23" fill="#3f3f3f" text-anchor="middle">the board</text>
  <line x1="832" y1="372" x2="958" y2="372" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="895" y="404" font-size="23" fill="#3f3f3f" text-anchor="middle">what is wrong with it</text>
  <rect x="675.9711500000001" y="666.0" width="284.1269" height="108" rx="13" fill="#b8d4ea"/>
  <text x="818.0346000000001" y="696.0" font-size="27" fill="#123146" text-anchor="middle" font-weight="700">circuit-analysis</text>
  <text x="818.0346000000001" y="734.0" font-size="23" fill="#123146" text-anchor="middle">what you meant</text>
  <path d="M 818 666 L 1061 414" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <rect x="983.9864500000001" y="666.0" width="307.2632" height="108" rx="13" fill="#b8d4ea"/>
  <text x="1137.61805" y="696.0" font-size="27" fill="#123146" text-anchor="middle" font-weight="700">parts-book</text>
  <text x="1137.61805" y="734.0" font-size="23" fill="#123146" text-anchor="middle">parts you can buy</text>
  <path d="M 1138 666 L 1132 414" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <rect x="1315.13805" y="666.0" width="268.8908" height="108" rx="13" fill="#b8d4ea"/>
  <text x="1449.58345" y="696.0" font-size="27" fill="#123146" text-anchor="middle" font-weight="700">design-review</text>
  <text x="1449.58345" y="734.0" font-size="23" fill="#123146" text-anchor="middle">seven experts</text>
  <path d="M 1450 666 L 1200 414" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
</svg>
