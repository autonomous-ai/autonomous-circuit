<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1125" width="2000" height="1125" font-family="Poppins, Avenir Next, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 10 6 L 1.5 10.5" fill="none" stroke="#6f6f6f"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="2000" height="1125" fill="#ffffff"/>
  <text x="1000" y="92" font-size="52" fill="#1a1a1a" text-anchor="middle" font-weight="700">High-level architecture of Autonomous Circuit</text>
  <rect x="30" y="168" width="500" height="900" rx="26" fill="#eceae3"/>
  <text x="280" y="250" font-size="40" fill="#6f6f6f" text-anchor="middle" font-weight="700">The chat</text>
  <rect x="64" y="330" width="58" height="58" rx="14" fill="#c8623a"/>
  <text x="93" y="370" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">◆</text>
  <text x="146" y="352" font-size="33" fill="#1f1f1f" text-anchor="start" font-weight="700">What do you</text>
  <text x="146" y="392" font-size="33" fill="#1f1f1f" text-anchor="start" font-weight="700">want to build?</text>
  <circle cx="93" cy="486" r="25" fill="none" stroke="#9a9a9a" stroke-width="2.4"/><circle cx="93" cy="477" r="9" fill="none" stroke="#9a9a9a" stroke-width="2.4"/><path d="M 79 502 a 14 12 0 0 1 28 0" fill="none" stroke="#9a9a9a" stroke-width="2.4"/>
  <text x="146" y="470" font-size="27" fill="#4a4a4a" text-anchor="start">a coaster that</text>
  <text x="146" y="510" font-size="27" fill="#4a4a4a" text-anchor="start">reminds me to</text>
  <text x="146" y="550" font-size="27" fill="#4a4a4a" text-anchor="start">drink water. it</text>
  <text x="146" y="590" font-size="27" fill="#4a4a4a" text-anchor="start">should light up</text>
  <text x="146" y="630" font-size="27" fill="#4a4a4a" text-anchor="start">when my cup is</text>
  <text x="146" y="670" font-size="27" fill="#4a4a4a" text-anchor="start">empty. usb-c</text>
  <text x="146" y="710" font-size="27" fill="#4a4a4a" text-anchor="start">powered.</text>
  <line x1="546" y1="430" x2="762" y2="430" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="654" y="404" font-size="26" fill="#3f3f3f" text-anchor="middle" font-weight="700">Your request</text>
  <line x1="762" y1="700" x2="546" y2="700" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="654" y="674" font-size="26" fill="#3f3f3f" text-anchor="middle" font-weight="700">The files to order</text>
  <rect x="770" y="168" width="1200" height="900" rx="26" fill="#eceae3"/>
  <text x="1370" y="250" font-size="38" fill="#6f6f6f" text-anchor="middle" font-weight="700">Multi-agent electrical engineering system</text>
  <rect x="1140.0" y="396.0" width="520" height="208" rx="13" fill="#b8d4ea"/>
  <text x="1400" y="426.0" font-size="32" fill="#123146" text-anchor="middle" font-weight="700">circuitcode</text>
  <text x="1400" y="470.0" font-size="32" fill="#123146" text-anchor="middle" font-weight="700">(lead agent)</text>
  <text x="1400" y="514.0" font-size="28" fill="#123146" text-anchor="middle">Tools: golden blocks + circuitlib</text>
  <text x="1400" y="558.0" font-size="28" fill="#123146" text-anchor="middle">+ generator + run_subagent</text>
  <rect x="1741.0" y="446.0" width="210" height="108" rx="13" fill="#b8d4ea"/>
  <text x="1846" y="476.0" font-size="29" fill="#123146" text-anchor="middle" font-weight="700">Golden</text>
  <text x="1846" y="514.0" font-size="29" fill="#123146" text-anchor="middle" font-weight="700">blocks</text>
  <line x1="1698" y1="500" x2="1740" y2="500" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <line x1="1740" y1="500" x2="1698" y2="500" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <rect x="750.25" y="427.0" width="311.5" height="146" rx="13" fill="#f0c8b4"/>
  <text x="906" y="457.0" font-size="29" fill="#7a3418" text-anchor="middle" font-weight="700">The checks</text>
  <text x="906" y="495.0" font-size="25" fill="#7a3418" text-anchor="middle">not an agent —</text>
  <text x="906" y="533.0" font-size="25" fill="#7a3418" text-anchor="middle">plain code, no model</text>
  <line x1="1112" y1="470" x2="1094" y2="470" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <line x1="1094" y1="530" x2="1112" y2="530" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <rect x="856.584" y="825.0" width="312.98380000000003" height="70" rx="13" fill="#b8d4ea"/>
  <text x="1013.0758999999999" y="855.0" font-size="29" fill="#123146" text-anchor="middle" font-weight="700">Brief subagent</text>
  <path d="M 999 806 L 1115 604" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <path d="M 1143 604 L 1027 806" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <path d="M 1047 916 a 40 30 0 1 0 -66 8" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <rect x="1229.5678" y="825.0" width="312.98380000000003" height="70" rx="13" fill="#b8d4ea"/>
  <text x="1386.0597" y="855.0" font-size="29" fill="#123146" text-anchor="middle" font-weight="700">Parts subagent</text>
  <path d="M 1372 806 L 1376 604" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <path d="M 1404 604 L 1400 806" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <path d="M 1420 916 a 40 30 0 1 0 -66 8" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <rect x="1602.5516" y="825.0" width="340.86440000000005" height="70" rx="13" fill="#b8d4ea"/>
  <text x="1772.9838" y="855.0" font-size="29" fill="#123146" text-anchor="middle" font-weight="700">Review subagent</text>
  <path d="M 1759 806 L 1647 604" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <path d="M 1675 604 L 1787 806" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <path d="M 1807 916 a 40 30 0 1 0 -66 8" fill="none" stroke="#6f6f6f" stroke-width="2.1" marker-end="url(#arw)"/>
  <text x="1400" y="1020" font-size="26" fill="#3f3f3f" text-anchor="middle">each subagent gets one question and its own context</text>
