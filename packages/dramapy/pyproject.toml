[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dramapy"
version = "0.1.0"
description = "Episode generation runtime for Autonomous TV's dramacode skill: shots, stitch, subtitles, review artifacts."
requires-python = ">=3.10"
# ZERO runtime Python dependencies by design (contract v1): all media work
# goes through the PATH ffmpeg/ffprobe binaries via subprocess.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dramapy*"]

[tool.setuptools.package-data]
dramapy = ["py.typed"]
