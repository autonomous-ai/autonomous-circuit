[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kicadpy"
version = "0.1.0"
description = "Revision-bound native KiCad repair transactions"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
kicadpy = "kicadpy.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "../circuitpy/src"]
testpaths = ["tests"]
